[package]
name = "global-power-gis"
version = "0.2.0"
description = "全球电力设施 GIS 桌面工具"
authors = ["pstar119"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "global_power_gis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# 阶段12：本地 SQLite（仅启用 sqlite 驱动，mysql/postgres 关闭）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 阶段44：数据包下载。
# ‼️ 刻意关掉默认特性：ureq 默认是 rustls，会拉进 ring/aws-lc（需要 C 工具链且体积大）。
#    改用 native-tls —— Windows 上走系统 schannel，纯回归调用，体积小得多。
#    PMTiles 以 octet-stream 直传，不需要 gzip/json 特性。
ureq = { version = "3", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
# 阶段52：CSV 导出的原生「另存为」对话框。
# ‼️ 阶段54：**只留 dialog，本 crate 的直接依赖里已删掉 `tauri-plugin-fs`** ——
#    写盘动作已下沉到 `src/export.rs`（路径由 Rust 侧对话框产生、Rust 侧写），
#    前端不再需要写文件能力，于是 `fs:write-all` 这个过宽权限一并删掉。
#    ⚠️ 别再因为「要给用户选路径」而加回 fs 插件 —— 那会重新引入
#       「前端可写任意路径」，而真正的正解是在 Rust 侧写（见 export.rs 的头部说明）。
#    🔴 **别指望删掉它能让体积变小**：`tauri-plugin-fs` 是 `tauri-plugin-dialog`
#       的传递依赖（见 Cargo.lock），删直接依赖后它照样被编译链接。
#       本次收益是**权限收敛**，不是体积。
tauri-plugin-dialog = "2.7.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
